<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>TripBalancing – AI Travel Planner & Smart Budget Optimizer</title>
    <meta name="title" content="TripBalancing – AI Travel Planner & Smart Budget Optimizer" />
    <meta name="description" content="Plan unforgettable journeys with TripBalancing. AI-powered travel itineraries, smart budget balancing, interactive daily schedules, currency conversion, and real-time travel recommendations." />
    <meta name="keywords" content="AI travel planner, travel budget optimizer, itinerary generator, smart travel planner, trip balancing, travel expense tracker" />
    <meta name="author" content="TripBalancing" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://tripbalancing.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tripbalancing.app/" />
    <meta property="og:title" content="TripBalancing – AI Travel Planner & Smart Budget Optimizer" />
    <meta property="og:description" content="Plan custom itineraries, manage travel budgets, and explore destinations with AI-powered personalized travel guides." />
    <meta property="og:image" content="https://tripbalancing.app/logo.svg" />
    <meta property="og:site_name" content="TripBalancing" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tripbalancing.app/" />
    <meta property="twitter:title" content="TripBalancing – AI Travel Planner & Smart Budget Optimizer" />
    <meta property="twitter:description" content="Plan custom itineraries, manage travel budgets, and explore destinations with AI-powered personalized travel guides." />
    <meta property="twitter:image" content="https://tripbalancing.app/logo.svg" />

    <!-- Structured Data (JSON-LD) for WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TripBalancing",
      "alternateName": "TripBalancing AI Travel Planner",
      "url": "https://tripbalancing.app/",
      "logo": "https://tripbalancing.app/logo.svg",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "TripBalancing is an AI-powered travel planning web application that creates personalized day-by-day travel itineraries, optimizes budgets, provides real-time destination insights, and enables collaborative trip planning.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI-Powered Custom Itinerary Generation",
        "Real-Time Travel Budget Balancing & Expense Tracking",
        "Destination Weather & Safety Advisories",
        "Multi-Currency Exchange Rate Calculator",
        "Travel Buddy Collaboration & Invitation System",
        "Interactive World Map Destination Visualizer",
        "Exportable PDF Travel Guides"
      ],
      "author": {
        "@type": "Organization",
        "name": "TripBalancing",
        "url": "https://tripbalancing.app/"
      }
    }
    </script>

    <!-- Performance Preconnect & Preload Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://checkout.razorpay.com" />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

    <!-- Leaflet Map CSS & JS CDNs -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    
    <!-- Razorpay Standard Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
