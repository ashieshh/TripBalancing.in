<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>TripBalancing – AI Travel Planner & Smart Budget Optimizer</title>
    <meta name="title" content="TripBalancing – AI Travel Planner & Smart Budget Optimizer" />
    <meta name="description" content="Plan unforgettable journeys with TripBalancing. AI-powered travel itineraries, smart budget balancing, interactive daily schedules, currency conversion, and real-time travel recommendations." />
    <meta name="keywords" content="AI travel planner, travel budget optimizer, itinerary generator, smart travel planner, trip balancing, travel expense tracker" />
    <meta name="author" content="TripBalancing" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA Manifest & Mobile Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripBalancing" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://tripbalancing.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tripbalancing.app/" />
    <meta property="og:title" content="TripBalancing – AI Travel Planner & Smart Budget Optimizer" />
    <meta property="og:description" content="Plan custom itineraries, manage travel budgets, and explore destinations with AI-powered personalized travel guides." />
    <meta property="og:image" content="https://tripbalancing.app/logo.svg" />
    <meta property="og:site_name" content="TripBalancing" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tripbalancing.app/" />
    <meta property="twitter:title" content="TripBalancing – AI Travel Planner & Smart Budget Optimizer" />
    <meta property="twitter:description" content="Plan custom itineraries, manage travel budgets, and explore destinations with AI-powered personalized travel guides." />
    <meta property="twitter:image" content="https://tripbalancing.app/logo.svg" />

    <!-- Structured Data (JSON-LD) for WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TripBalancing",
      "alternateName": "TripBalancing AI Travel Planner",
      "url": "https://tripbalancing.app/",
      "logo": "https://tripbalancing.app/logo.svg",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "All",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "description": "TripBalancing is an AI-powered travel planning web application that creates personalized day-by-day travel itineraries, optimizes budgets, provides real-time destination insights, and enables collaborative trip planning.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI-Powered Custom Itinerary Generation",
        "Real-Time Travel Budget Balancing & Expense Tracking",
        "Destination Weather & Safety Advisories",
        "Multi-Currency Exchange Rate Calculator",
        "Travel Buddy Collaboration & Invitation System",
        "Interactive World Map Destination Visualizer",
        "Exportable PDF Travel Guides"
      ],
      "author": {
        "@type": "Organization",
        "name": "TripBalancing",
        "url": "https://tripbalancing.app/"
      }
    }
    </script>

    <!-- Performance Preconnect & Preload Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
    <script>
      window.addEventListener('error', function(e) {
        var spinner = document.getElementById('pwa-splash-spinner');
        var errBox = document.getElementById('pwa-splash-error');
        if (spinner) spinner.style.display = 'none';
        if (errBox) {
          errBox.style.display = 'block';
          errBox.innerHTML = '<strong>App Launch Error:</strong> ' + (e.message || 'An unexpected error occurred during startup.') + '<br/><button onclick="window.location.reload()" style="margin-top: 12px; padding: 8px 18px; background-color: #14b8a6; color: #0f172a; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">Reload Application</button>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- PWA Instant App Shell Splash Screen -->
      <div id="pwa-splash" style="position: fixed; inset: 0; background-color: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 88px; height: 88px; background: rgba(13, 148, 136, 0.15); border: 1.5px solid rgba(20, 184, 166, 0.3); border-radius: 24px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 12px 30px -5px rgba(0,0,0,0.5);">
          <img src="/logo.svg" alt="TripBalancing Logo" style="width: 56px; height: 56px;" />
        </div>
        <div style="font-size: 22px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; margin-bottom: 6px;">TripBalancing</div>
        <div style="font-size: 12px; font-weight: 700; color: #14b8a6; text-transform: uppercase; letter-spacing: 0.12em;">AI Travel & Budget Optimizer</div>
        <div id="pwa-splash-spinner" style="margin-top: 32px; width: 32px; height: 32px; border: 3px solid rgba(20,184,166,0.2); border-top-color: #14b8a6; border-radius: 50%; animation: pwa-splash-spin 0.8s linear infinite;"></div>
        <div id="pwa-splash-error" style="display: none; margin-top: 24px; padding: 14px 20px; background-color: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; color: #f87171; font-size: 13px; font-weight: 600; text-align: center; max-width: 90%;"></div>
        <style>
          @keyframes pwa-splash-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
