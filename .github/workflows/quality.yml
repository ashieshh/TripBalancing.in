name: TripBalancing quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:variants
      - run: npm run lint
      - run: npx vite build
      - run: npx esbuild server.ts --platform=node --packages=external --bundle --format=esm --outfile=/tmp/tripbalancing-server.mjs
