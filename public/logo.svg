<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Dark Glow Container / Background (optional dark or transparent) -->
  <rect width="200" height="200" rx="32" fill="#080c14" />

  <!-- 3 Concentric Sonar Rings -->
  <circle cx="100" cy="100" r="90" stroke="#00E5FF" stroke-width="1.6" stroke-opacity="0.9" fill="none" />
  <circle cx="100" cy="100" r="72" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.8" fill="none" />
  <circle cx="100" cy="100" r="52" stroke="#00E5FF" stroke-width="1.0" stroke-opacity="0.7" fill="none" />

  <!-- 4-Pointed Faceted Compass Star -->
  
  <!-- NORTH POINT -->
  <polygon points="100,10 84,75 100,100" fill="#00B8D4" />
  <polygon points="100,10 116,75 100,100" fill="#00E5FF" />

  <!-- SOUTH POINT -->
  <polygon points="100,190 84,125 100,100" fill="#00E5FF" />
  <polygon points="100,190 116,125 100,100" fill="#00B8D4" />

  <!-- EAST POINT -->
  <polygon points="190,100 125,84 100,100" fill="#00E5FF" />
  <polygon points="190,100 125,116 100,100" fill="#00B8D4" />

  <!-- WEST POINT -->
  <polygon points="10,100 75,84 100,100" fill="#00B8D4" />
  <polygon points="10,100 75,116 100,100" fill="#00E5FF" />

  <!-- CENTRAL RING & HUB -->
  <circle cx="100" cy="100" r="16" fill="#080c14" stroke="#00E5FF" stroke-width="2.5" />
  <circle cx="100" cy="100" r="6" fill="#00E5FF" />
</svg>
